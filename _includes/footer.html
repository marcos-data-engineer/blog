<!-- Google Translate Integration -->
<div id="google_translate_element" style="display: none;"></div>
<script>
  if (window.location.hostname.indexOf('translate.goog') !== -1) {
    window.location.replace('https://marcos-data-engineer.github.io' + window.location.pathname);
  }

  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      includedLanguages: 'pt,en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function setLanguageCookie(lang) {
    var isPt = (lang === 'pt');
    var host = window.location.hostname;
    if (isPt) {
      document.cookie = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie = 'googtrans=; path=/blog; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie = 'googtrans=; path=/; domain=' + host + '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie = 'googtrans=; path=/blog; domain=' + host + '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      if (host.indexOf('.') !== -1) {
        document.cookie = 'googtrans=; path=/; domain=.' + host + '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
        document.cookie = 'googtrans=; path=/blog; domain=.' + host + '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      }
      return;
    }
    var val = '/pt/' + lang;
    document.cookie = 'googtrans=' + val + '; path=/';
    document.cookie = 'googtrans=' + val + '; path=/; domain=' + host;
    if (host.indexOf('.') !== -1) {
      document.cookie = 'googtrans=' + val + '; path=/; domain=.' + host;
    }
  }

  function updateActiveLangBtn(targetLang) {
    document.querySelectorAll('.pf-lang-btn').forEach(function(b) {
      if (b.getAttribute('data-lang') === targetLang) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    });
  }

  function translatePage(targetLang) {
    setLanguageCookie(targetLang);
    updateActiveLangBtn(targetLang);

    if (targetLang === 'pt') {
      window.location.reload();
      return;
    }

    var select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = targetLang;
      select.dispatchEvent(new Event('change', { bubbles: true }));
      select.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      setTimeout(function() {
        window.location.reload();
      }, 150);
    }
  }

  (function() {
    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : '';
    }
    var currentCookie = getCookie('googtrans');
    var activeLang = 'pt';
    if (currentCookie.indexOf('/en') !== -1) activeLang = 'en';
    else if (currentCookie.indexOf('/es') !== -1) activeLang = 'es';

    updateActiveLangBtn(activeLang);
  })();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
