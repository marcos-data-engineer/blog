# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: >-
          bundle exec jekyll build
          --baseurl "${{ steps.pages.outputs.base_path }}"
          --destination ./_site
        env:
          JEKYLL_ENV: production
      - name: Validate Pages artifact
        run: |
          test -f ./_site/sitemap.xml
          test -f ./_site/robots.txt
          grep -Fx 'Sitemap: https://marcos-data-engineer.github.io/blog/sitemap.xml' ./_site/robots.txt
          ruby -r rexml/document -e '
            document = REXML::Document.new(File.read("./_site/sitemap.xml"))
            root = document.root
            expected_namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
            abort "Invalid sitemap root" unless root&.name == "urlset" && root.namespace == expected_namespace
            locations = REXML::XPath.match(document, "//*[local-name()=\"loc\"]").map(&:text)
            abort "sitemap.xml has no URLs" if locations.empty?
            expected_prefix = "https://marcos-data-engineer.github.io/blog/"
            invalid = locations.reject { |location| location.start_with?(expected_prefix) }
            abort "Invalid sitemap URLs: #{invalid.join(", ")}" unless invalid.empty?
          '
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
